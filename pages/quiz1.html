<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>English Quiz</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <div id="toolbar">

        <button id="nav-home" hidden type="button">
            Home
        </button>

        <button id="nav-open" type="button">
            Menu
        </button>

    </div>

    <div id="quiz-container">

        <h2 id="quiz-question-label">
            Loading questions...
        </h2>

        <button class="quiz-answer" type="button">Answer 1</button>
        <button class="quiz-answer" type="button">Answer 2</button>
        <button class="quiz-answer" type="button">Answer 3</button>
        <button class="quiz-answer" type="button">Answer 4</button>

        <h2 id="quiz-result-correctness"></h2>

        <button id="quiz-next-question" type="button" hidden>
            Next
        </button>

    </div>

    <script type="module" src="../src/index.js"></script>

</body>
</html>
